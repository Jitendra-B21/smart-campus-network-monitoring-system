spring.application.name=smart-campus-nms

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_campus_nms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
nms.netconf.host=${NETCONF_HOST:devnetsandboxiosxec8k.cisco.com}
nms.netconf.port=${NETCONF_PORT:830}
nms.netconf.username=${NETCONF_USERNAME:}
nms.netconf.password=${NETCONF_PASSWORD:}
nms.restconf.host=${RESTCONF_HOST:devnetsandboxiosxec8k.cisco.com}
nms.restconf.port=${RESTCONF_PORT:443}
nms.restconf.username=${NETCONF_USERNAME:}
nms.restconf.password=${NETCONF_PASSWORD:}
nms.opennms.url=${OPENNMS_URL:http://localhost:8980/opennms}
nms.opennms.username=${OPENNMS_USERNAME:admin}
nms.opennms.password=${OPENNMS_PASSWORD:}